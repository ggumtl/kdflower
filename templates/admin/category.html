<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>카테고리 관리</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 15px; text-decoration: none; color: #007bff; font-weight: bold; }
        table { border-collapse: collapse; width: 100%; max-width: 650px; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; vertical-align: middle; }
        th { background-color: #f2f2f2; }
        .input-num { width: 60px; text-align: center; }
        .btn-sm { padding: 4px 8px; background-color: #28a745; color: white; border: none; border-radius: 3px; cursor: pointer; }
    </style>
</head>
<body>
    <nav>
        <a href="/admin/category">카테고리 관리</a> | 
        <a href="/admin/flower">꽃 목록 관리</a> | 
        <a href="/admin/gallery-view">갤러리 뷰</a> | 
        <a href="/admin/logout">로그아웃</a>
    </nav>

    <h2>카테고리 등록 및 순서 관리</h2>
    
    <form action="/admin/category" method="post" style="margin-bottom: 20px;">
        <input type="text" name="name" placeholder="카테고리명" required>
        <input type="number" name="order_no" placeholder="순서 (작을수록 우선)" value="0" class="input-num">
        <button type="submit">카테고리 추가</button>
    </form>

    <h3>등록된 카테고리 목록</h3>
    <table>
        <thead>
            <tr>
                <th>정렬 순서(Order)</th>
                <th>카테고리명</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody>
            {% for cat in categories %}
            <tr>
                <form action="/admin/category/edit/{{ cat.idx }}" method="post">
                    <td>
                        <input type="number" name="order_no" value="{{ cat.order_no }}" class="input-num" required>
                    </td>
                    <td>
                        <input type="text" name="name" value="{{ cat.name }}" required>
                    </td>
                    <td>
                        <button type="submit" class="btn-sm">수정 저장</button>
                    </td>
                </form>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
        window.addEventListener('beforeunload', function () {
            sessionStorage.setItem('scrollPosition', window.scrollY);
        });

        window.addEventListener('DOMContentLoaded', function () {
            const savedPosition = sessionStorage.getItem('scrollPosition');
            if (savedPosition !== null) {
                window.scrollTo(0, parseInt(savedPosition, 10));
                sessionStorage.removeItem('scrollPosition');
            }
        });
    </script>
</body>
</html>
